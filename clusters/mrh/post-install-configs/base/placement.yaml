apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: mrh-placement
  namespace: mrh-policies
spec:
  clusterSets: [global]
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchExpressions:
        - {key: name, operator: In, values: [local-cluster]}
