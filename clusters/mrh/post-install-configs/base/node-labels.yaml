apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: mrh-node-labels
  namespace: mrh-policies
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: mrh-node-labeling
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Node
            metadata:
              name: worker1.mrh.dev.mindsparks.io
              labels:
                demo.mindsparks.io/role: app
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Node
            metadata:
              name: worker2.mrh.dev.mindsparks.io
              labels:
                demo.mindsparks.io/role: app
