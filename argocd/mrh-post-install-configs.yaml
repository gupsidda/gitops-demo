apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mrh-post-install-configs
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gupsidda/gitops-demo.git
    targetRevision: main
    path: clusters/mrh/post-install-configs/base
  destination:
    server: https://kubernetes.default.svc
    namespace: mrh-policies
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
